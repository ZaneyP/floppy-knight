<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Floppy Knight</title>
<meta name="description" content="Fling a floppy ragdoll knight to protect a traveler on the road from town to town.">
<style>
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none;
           user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="game" aria-label="Floppy Knight game"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Canvas & scaling (fixed 540x960 logical playfield, letterboxed to any size
// so it behaves inside an iframe embed of any dimensions)
// ---------------------------------------------------------------------------
const W = 540, H = 960;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function hash(a) {
  a |= 0;
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a ^= a >>> 16;
  return (a >>> 0) / 4294967296;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return { d: Math.hypot(px - (ax + dx * t), py - (ay + dy * t)), t, x: ax + dx * t, y: ay + dy * t };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};

// ---------------------------------------------------------------------------
// Audio (all synthesized, no asset files)
// ---------------------------------------------------------------------------
let actx = null, master = null, noiseBuf = null;
let muted = store.get('fk_muted', false);

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000, q = 1, type = 'bandpass', delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  const f = actx.createBiquadFilter();
  f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const sfx = {
  whoosh() { noise(0.18, 0.1, 650, 0.8); },
  hit() { noise(0.08, 0.35, 1800, 1); tone(150, 0.12, 'sine', 0.35, 0.5); },
  kill() { tone(330, 0.22, 'square', 0.1, 0.3); noise(0.15, 0.25, 900, 1); },
  clank() { tone(1400, 0.12, 'triangle', 0.2, 0.9); tone(2100, 0.08, 'square', 0.05); },
  hurt() { tone(190, 0.3, 'sawtooth', 0.2, 0.4); },
  boom() { noise(0.6, 0.6, 320, 0.7, 'lowpass'); tone(80, 0.5, 'sine', 0.5, 0.3); },
  shoot() { tone(900, 0.07, 'triangle', 0.07, 0.5); },
  pickup() { tone(660, 0.1, 'square', 0.1); tone(990, 0.15, 'square', 0.1, 1, 0.08); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'square', 0.1, 1, i * 0.12)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'triangle', 0.18, 1, i * 0.18)); },
  boss() { [110, 104, 98].forEach((f, i) => tone(f, 0.45, 'sawtooth', 0.15, 1, i * 0.3)); },
};
function setMuted(m) { muted = m; store.set('fk_muted', m); if (master) master.gain.value = m ? 0 : 0.5; }

// ---------------------------------------------------------------------------
// Input — the pointer IS the knight's head
// ---------------------------------------------------------------------------
const pointer = { x: W / 2, y: H * 0.5 };
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: clamp((e.clientX - r.left - offX) / scale, 0, W), y: clamp((e.clientY - r.top - offY) / scale, 0, H) };
}
cv.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; });
cv.addEventListener('pointerdown', e => {
  initAudio();
  const p = toLogical(e);
  pointer.x = p.x; pointer.y = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  onClick(p.x, p.y);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') setMuted(!muted);
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (paused) paused = false; else pause(); }
});

// ---------------------------------------------------------------------------
// The floppy knight (Verlet ragdoll + rigidly gripped sword)
// ---------------------------------------------------------------------------
const KNIGHT_BASE = 0.62; // starting knight scale (1 = original size)
const K = { p: null, pts: [], sticks: [], trail: [], tipSpeed: 0, k: KNIGHT_BASE, len: 46, wide: 1, pad: 3 };
// Knight size & sword come from upgrades. Starts small (KNIGHT_BASE) and grows.
function buildKnight(x, y) {
  const u = G.upg, k = KNIGHT_BASE * (1 + u.growth * 0.15);
  K.k = k;
  K.len = (74 + u.length * 18 + u.length * u.length * 1.5) * k; // blade reach (accelerates: absurd swords are the goal)
  K.wide = 1 + u.width * 0.45;        // blade thickness (visual)
  K.pad = 3 + u.width * 5;            // extra hit tolerance
  // Held by the ankles: (x, y) is the grip between the feet, body hangs upside down below it.
  K.ax = x; K.ay = y;
  const P = (dx, dy, im) => ({ x: x + dx * k, y: y + (102 - dy) * k, px: x + dx * k, py: y + (102 - dy) * k, im });
  const p = {
    head: P(0, 0, 1), neck: P(0, 18, 1), pelvis: P(0, 54, 1),
    lElb: P(-20, 28, 1), lHand: P(-30, 14, 1),
    rElb: P(20, 28, 1), rHand: P(30, 14, 1),
    lKnee: P(-8, 78, 1), lFoot: P(-10, 102, 0),
    rKnee: P(8, 78, 1), rFoot: P(10, 102, 0),
    tip: P(40, 14 - K.len / k, 0.35), // heavy blade end = momentum
  };
  const s = (a, b, l) => ({ a: p[a], b: p[b], l });
  K.p = p;
  K.pts = Object.values(p);
  K.sticks = [
    s('head', 'neck', 18 * k), s('neck', 'pelvis', 36 * k), s('head', 'pelvis', 53 * k),
    s('neck', 'lElb', 22 * k), s('lElb', 'lHand', 20 * k), s('neck', 'rElb', 22 * k), s('rElb', 'rHand', 20 * k),
    s('pelvis', 'lKnee', 24 * k), s('lKnee', 'lFoot', 24 * k), s('pelvis', 'rKnee', 24 * k), s('rKnee', 'rFoot', 24 * k),
    s('rHand', 'tip', K.len), s('rElb', 'tip', K.len + 17 * k),
  ];
}

const GRAV = 0.32, DAMP = 0.985;
const spinCdFor = l => Math.max(0.8, 4 * Math.pow(0.8, l - 1)); // seconds between whirlwinds
function trySpin() {
  if (!G.upg.spin || G.spinCd > 0 || G.spinT > 0) return;
  const p = K.p, h = { x: K.ax, y: K.ay }, t = p.tip;
  const cross = (t.x - h.x) * (t.y - t.py) - (t.y - h.y) * (t.x - t.px);
  G.spinDir = cross < 0 ? -1 : 1;
  G.spinT = 0.75; G.spinCd = spinCdFor(G.upg.spin);
  sfx.whoosh(); tone(220, 0.5, 'triangle', 0.12, 3);
}
function stepKnight() {
  const p = K.p;
  let dx = pointer.x - K.ax, dy = pointer.y - K.ay;
  const d = Math.hypot(dx, dy), mx = 55; // clamp teleports (touch taps) so physics can't explode
  if (d > mx) { dx *= mx / d; dy *= mx / d; }
  K.ax += dx; K.ay += dy;
  for (const [f, side] of [[p.lFoot, -1], [p.rFoot, 1]]) { // the grip: both ankles follow the mouse
    f.px = f.x; f.py = f.y;
    f.x = K.ax + side * 6 * K.k; f.y = K.ay;
  }
  const spinning = G.spinT > 0, g = spinning ? 0 : GRAV;
  for (const q of K.pts) {
    if (!q.im) continue;
    const vx = (q.x - q.px) * DAMP, vy = (q.y - q.py) * DAMP;
    q.px = q.x; q.py = q.y;
    q.x += vx; q.y += vy + g;
  }
  if (spinning) { // whirlwind: drive the body around the grip
    G.spinT -= 1 / 60;
    const h = { x: K.ax, y: K.ay };
    for (const [q, f, cap] of [[p.tip, 5, 36], [p.rHand, 2.5, 16], [p.rElb, 1.5, 10], [p.lHand, 1.5, 12], [p.head, 1.5, 14], [p.pelvis, 1, 8], [p.lKnee, 0.6, 5], [p.rKnee, 0.6, 5]]) {
      const rx = q.x - h.x, ry = q.y - h.y, rl = Math.hypot(rx, ry) || 1;
      const tx = -ry / rl * G.spinDir, ty = rx / rl * G.spinDir;
      if ((q.x - q.px) * tx + (q.y - q.py) * ty < cap * K.k / KNIGHT_BASE) { q.x += tx * f; q.y += ty * f; }
    }
  }
  G.spinCd -= 1 / 60;
  for (let it = 0; it < 10; it++) {
    for (const s of K.sticks) {
      const a = s.a, b = s.b;
      const sx = b.x - a.x, sy = b.y - a.y;
      const dist = Math.hypot(sx, sy) || 0.0001;
      const diff = (dist - s.l) / dist;
      const sum = a.im + b.im;
      if (!sum) continue;
      const ka = a.im / sum, kb = b.im / sum;
      a.x += sx * diff * ka; a.y += sy * diff * ka;
      b.x -= sx * diff * kb; b.y -= sy * diff * kb;
    }
  }
  for (const q of K.pts) {
    const m = 60 + K.len + 100 * K.k; // big knights/swords may reach far off-screen
    q.x = clamp(q.x, -m, W + m);
    q.y = clamp(q.y, -m, H + m);
  }
  const t = p.tip;
  K.tipSpeed = Math.hypot(t.x - t.px, t.y - t.py);
  K.trail.unshift({ hx: p.rHand.x, hy: p.rHand.y, tx: t.x, ty: t.y, s: K.tipSpeed });
  if (K.trail.length > 7) K.trail.pop();
  G.whooshCd -= 1 / 60;
  if (K.tipSpeed > 17 && G.whooshCd <= 0) { sfx.whoosh(); G.whooshCd = 0.28; }
}

// ---------------------------------------------------------------------------
// World data
// ---------------------------------------------------------------------------
const WALK = 60; // px/s the ground scrolls
const TRAVELER_Y = 800;

// "Rolling log" world: the ground wraps over a big cylinder (like Animal Crossing).
// Gameplay runs in flat world coords; warp() maps world -> screen for drawing and sword hits.
const BASE = H + 40, R = 840, DOME = 70, HALF_PI = Math.PI / 2;
const HORIZON_WY = BASE - R * HALF_PI;            // world y that sits on the horizon
const CASTLE_FAR = R * (HALF_PI + 0.3), CASTLE_NEAR = 730;
function warp(x, y) {
  const phi = (BASE - y) / R, c = Math.cos(phi);
  const hs = clamp(1 - 0.45 * (1 - c), 0.4, 1);
  const dx = (x - W / 2) * hs;
  return { x: W / 2 + dx, y: BASE - R * Math.sin(phi) + DOME * (1 - c) * (dx / (W / 2)) ** 2, s: hs, phi, c };
}
const horizonY = X => BASE - R + DOME * ((X - W / 2) / (W / 2)) ** 2;
const castleWorldY = () => BASE - lerp(CASTLE_FAR, CASTLE_NEAR, G.prog);
const hidden = w => w.phi > HALF_PI + 0.02;
const BIOMES = [
  { g1: '#5f9e4a', g2: '#548f40', g3: '#72b257', road: '#c8a46b', edge: '#a3804c', tree: '#2f6e35', tree2: '#46913f', sky1: '#79c2f0', sky2: '#dcf1fb', roof: '#c0392b', stone: '#a7a196', decor: ['tree', 'tree', 'bush', 'rock', 'flowers', 'flowers'] },
  { g1: '#8b9a45', g2: '#7c8a3a', g3: '#a0b055', road: '#b98d5a', edge: '#94693d', tree: '#c2651f', tree2: '#e0a030', sky1: '#8dbde0', sky2: '#f4e3c6', roof: '#2c5f8a', stone: '#a0998e', decor: ['tree', 'tree', 'bush', 'rock', 'leaves', 'leaves'] },
  { g1: '#dcbd78', g2: '#cdab65', g3: '#e8cd8e', road: '#b98e5a', edge: '#9a7244', tree: '#4f8a3a', tree2: '#6aa34d', sky1: '#6cb2e8', sky2: '#f7e8c4', roof: '#b5651d', stone: '#cdb88f', decor: ['cactus', 'rock', 'rock', 'bones', 'shrub', 'cactus'] },
  { g1: '#e6eef3', g2: '#d5e1e9', g3: '#f7fbfd', road: '#b5ada0', edge: '#918879', tree: '#2d5a46', tree2: '#3e7459', sky1: '#a6c4dc', sky2: '#eef4f8', roof: '#6b3fa0', stone: '#8f98a3', decor: ['pine', 'pine', 'rock', 'drift', 'pine'] },
  { g1: '#4d6b4a', g2: '#425d3f', g3: '#5b7c57', road: '#8a7a5e', edge: '#685a42', tree: '#26402c', tree2: '#35583b', sky1: '#6a7c98', sky2: '#cdc5d2', roof: '#46466a', stone: '#7d8083', decor: ['pine', 'rock', 'bush', 'mushroom', 'tree'] },
];
const PRE = ['Ash', 'Bram', 'Kings', 'Wolf', 'Raven', 'Stone', 'Thorn', 'Elder', 'Mist', 'Iron', 'Oak', 'Gold', 'Frost', 'Dun', 'Black', 'High', 'Red', 'Willow', 'Storm', 'Hollow'];
const SUF = ['ford', 'wick', 'haven', 'hold', 'moor', 'gate', 'vale', 'reach', 'keep', 'bury', 'helm', 'spire', 'watch', 'fell'];
const townName = n => PRE[Math.floor(hash(Math.imul(n, 0x9e3779b1) + 0x68e31da4) * PRE.length)] + SUF[Math.floor(hash(Math.imul(n + 77, 0x85ebca6b) ^ 0x2545f491) * SUF.length)];

const DEFS = {
  bandit:  { r: 14, hp: 1, spd: 55,  dmg: 1, score: 100,  min: 6,  color: '#8a5530', mask: '#2b2b2b', unlock: 1 },
  armored: { r: 15, hp: 3, spd: 46,  dmg: 1, score: 300,  min: 6,  color: '#7d8794', mask: '#3a4049', unlock: 2, armor: true },
  runner:  { r: 12, hp: 1, spd: 112, dmg: 1, score: 150,  min: 6,  color: '#3c6e8f', mask: '#1d2a33', unlock: 3 },
  archer:  { r: 14, hp: 1, spd: 55,  dmg: 1, score: 200,  min: 6,  color: '#4f6b2c', mask: '#1f2a12', unlock: 4 },
  brute:   { r: 24, hp: 4, spd: 32,  dmg: 2, score: 400,  min: 7,  color: '#7a3434', mask: '#2a1a1a', unlock: 5 },
  shield:  { r: 16, hp: 2, spd: 45,  dmg: 1, score: 300,  min: 14, color: '#5a5e66', mask: '#222', unlock: 6 },
  bomber:  { r: 14, hp: 1, spd: 72,  dmg: 2, score: 250,  min: 6,  color: '#3d3d3d', mask: '#a52a2a', unlock: 7 },
  king:    { r: 38, hp: 22, spd: 22, dmg: 3, score: 3000, min: 9,  color: '#5b2a6b', mask: '#1a1020', unlock: 999 },
};
const SPAWN_WEIGHT = { bandit: 10, armored: 5, runner: 5, archer: 3, brute: 2, shield: 3, bomber: 2 };
const NEW_ENEMY = {
  2: 'NEW: Armored bandits. Each hit only does 1 damage and knocks them back. Takes 3 hits!',
  3: 'NEW: Runners. Fast and twitchy!',
  4: 'NEW: Archers. Swat arrows out of the air!',
  5: 'NEW: Brutes. Tough. Hit them hard and often.',
  6: 'NEW: Shieldbearers. Only a hard, fast swing breaks through!',
  7: 'NEW: Bombers. Kill them away from the traveler. Their blast hurts bandits too!',
  9: 'NEW: Elite bandits (gold trim) are tougher and worth double.',
};

// Shop: every upgrade is always for sale; each level costs more gold than the last.
// cost(level) = base * mult^level, rounded to 5. max: Infinity = scales forever.
const UPGRADES = [
  { id: 'spin', name: 'Whirlwind', base: 70, mult: 1.6, max: 8, desc: l => l === 0 ? 'Unlock: CLICK to spin into a tornado.' : `Spin recharges faster (${spinCdFor(l).toFixed(1)}s → ${spinCdFor(l + 1).toFixed(1)}s).` },
  { id: 'length', name: 'Longer Blade', base: 45, mult: 1.45, max: Infinity, desc: l => l < 6 ? 'More reach, bigger arcs, faster tip.' : l < 12 ? 'Is that sword compensating for something?' : 'This is no longer a reasonable sword.' },
  { id: 'width', name: 'Broadsword', base: 45, mult: 1.45, max: Infinity, desc: l => l < 6 ? 'Wider blade. Easier to hit and block.' : 'It is basically a door now.' },
  { id: 'archers', name: 'Hired Archer', base: 100, mult: 1.7, max: 8, desc: l => l === 0 ? 'An archer escorts the traveler.' : 'Hire another escort archer.' },
  { id: 'keen', name: 'Keen Edge', base: 55, mult: 1.7, max: 5, desc: () => 'Slower swings cut. Crits come easier.' },
  { id: 'vigor', name: 'Sturdy Boots', base: 70, mult: 1.5, max: 10, desc: () => '+1 max heart for the traveler.' },
  { id: 'buckler', name: 'Buckler', base: 60, mult: 1.6, max: 5, desc: l => `Block the first ${l + 1} hit${l ? 's' : ''} on every road.` },
  { id: 'growth', name: "Giant's Draught", base: 80, mult: 1.5, max: Infinity, desc: l => l < 5 ? 'Your knight grows 15% bigger.' : 'He is getting concerningly large.' },
  { id: 'herbs', name: 'Healing Herbs', heal: true, desc: () => 'Fully heal the traveler (18g per heart).' },
];
const upgMaxed = u => u.heal ? G.hp >= G.maxHp : G.upg[u.id] >= u.max;
const upgCost = u => u.heal ? (G.maxHp - G.hp) * 18 : Math.round(u.base * Math.pow(u.mult, G.upg[u.id]) / 5) * 5;
const freshUpg = () => ({ spin: 0, length: 0, width: 0, archers: 0, keen: 0, vigor: 0, buckler: 0, growth: 0, herbs: 0 });
const ALLY_OFF = [[-62, 16], [62, 16], [0, 64], [-112, 44], [112, 44], [-64, 96], [64, 96], [0, 128]];

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const G = {
  state: 'title', stateT: 0, level: 1, score: 0, hp: 5, maxHp: 5,
  best: store.get('fk_best', 0), bestLevel: store.get('fk_bestLevel', 0),
  scroll: 0, walk: WALK, prog: 0, levelTime: 0, levelDur: 40, spawnT: 0,
  enemies: [], arrows: [], parts: [], corpses: [], texts: [], pickups: [], blasts: [],
  shake: 0, hitstop: 0, combo: 0, comboT: 0, kills: 0, levelKills: 0, bonus: 0, whooshCd: 0,
  traveler: { x: W / 2, y: TRAVELER_Y, anim: 0, hurtT: 0, alpha: 1 },
  town: townName(1), biome: BIOMES[0], boss: null, bossSpawned: false, isBoss: false, newHigh: false,
  upg: freshUpg(), gold: 0, goldBonus: 0, shopMsg: null, spinT: 0, spinCd: 0, spinDir: 1, blocks: 0, allyCd: [], allyArrows: [],
};
buildKnight(W / 2, H * 0.5);
let paused = false;
function pause() { if (G.state === 'play' || G.state === 'intro' || G.state === 'arrive') paused = true; }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);

function startGame() {
  G.level = 1; G.score = 0; G.hp = G.maxHp = 5; G.kills = 0; G.combo = 0; G.newHigh = false;
  G.upg = freshUpg(); G.spinCd = 0; G.gold = 0;
  buildKnight(K.ax, K.ay);
  startLevel();
}
function startLevel() {
  G.enemies = []; G.arrows = []; G.pickups = []; G.corpses = []; G.blasts = [];
  G.levelTime = 0; G.levelDur = Math.min(35 + G.level * 5, 90); G.spawnT = 1.2; G.levelKills = 0;
  G.boss = null; G.bossSpawned = false; G.isBoss = G.level % 5 === 0;
  G.town = townName(G.level); G.biome = BIOMES[(G.level - 1) % BIOMES.length];
  const tr = G.traveler; tr.y = TRAVELER_Y; tr.alpha = 1; tr.hurtT = 0;
  G.prog = 0; G.walk = WALK;
  G.blocks = G.upg.buckler; G.allyArrows = []; G.allyCd = [0.8, 1.3, 1.8];
  G.state = 'intro'; G.stateT = 0;
}
function beginArrive() {
  G.state = 'arrive'; G.stateT = 0;
  for (const e of G.enemies) e.flee = true;
  G.arrows = [];
  G.bonus = 250 * G.level + G.hp * 100;
  addText('The bandits flee!', W / 2, 420, '#fff', 30, 1.8);
}
function completeLevel() {
  G.state = 'complete'; G.stateT = 0;
  G.score += G.bonus;
  G.goldBonus = 15 + G.level * 4;
  G.gold += G.goldBonus;
  G.hp = Math.min(G.maxHp, G.hp + 1);
  G.shopMsg = null;
  saveBest(G.level);

}
// Shop layout (logical px)
const SHOP_Y = 222, ROW_H = 62, ROW_GAP = 67;
const CONT = { x: 110, y: 832, w: W - 220, h: 52 };
const shopRowAt = (x, y) => {
  if (x < 32 || x > W - 32) return -1;
  for (let i = 0; i < UPGRADES.length; i++) {
    const ry = SHOP_Y + i * ROW_GAP;
    if (y > ry && y < ry + ROW_H) return i;
  }
  return -1;
};
const onContinue = (x, y) => x > CONT.x && x < CONT.x + CONT.w && y > CONT.y && y < CONT.y + CONT.h;
function buyUpgrade(u, i) {
  const ry = SHOP_Y + i * ROW_GAP;
  if (upgMaxed(u)) { G.shopMsg = { i, s: u.heal ? 'Already at full health' : 'Fully upgraded', t: 1.2, bad: true }; return; }
  const cost = upgCost(u);
  if (G.gold < cost) { G.shopMsg = { i, s: `Need ${cost - G.gold} more gold`, t: 1.2, bad: true }; sfx.clank(); return; }
  G.gold -= cost;
  if (u.heal) G.hp = G.maxHp;
  else {
    G.upg[u.id]++;
    if (u.id === 'vigor') { G.maxHp++; G.hp = Math.min(G.maxHp, G.hp + 1); }
    if (u.id === 'length' || u.id === 'width' || u.id === 'growth') buildKnight(K.ax, K.ay);
  }
  G.shopMsg = { i, s: u.heal ? 'Healed!' : `${u.name} upgraded!`, t: 1.2, bad: false };
  sfx.pickup();
  burst(W - 100, ry + ROW_H / 2, '#ffd34d', 14, 180, 3);
}
function leaveShop() {
  const firstSpin = G.upg.spin === 1 && !G.spinTaught;
  G.level++; startLevel();
  if (firstSpin) { G.spinTaught = true; addText('CLICK to spin!', W / 2, 560, '#7dff9a', 26, 3); }
}
function gameOver() {
  G.state = 'gameover'; G.stateT = 0;
  saveBest(G.level - 1);
  sfx.lose();
}
function saveBest(levelsCleared) {
  if (G.score > G.best) { G.best = G.score; G.newHigh = true; store.set('fk_best', G.best); }
  if (levelsCleared > G.bestLevel) { G.bestLevel = levelsCleared; store.set('fk_bestLevel', G.bestLevel); }
}
function onClick(x, y) {
  if (x > W - 64 && y > H - 64) { setMuted(!muted); return; }
  if (paused) { paused = false; return; }
  if (G.state === 'title') startGame();
  else if (G.state === 'complete' && G.stateT > 0.6) {
    if (onContinue(x, y)) { leaveShop(); return; }
    const i = shopRowAt(x, y);
    if (i >= 0) buyUpgrade(UPGRADES[i], i);
  }
  else if (G.state === 'play' || G.state === 'intro' || G.state === 'arrive') trySpin();
  else if (G.state === 'gameover' && G.stateT > 1.0) startGame();
}

// Nearest world y an enemy may stand at: in front of the castle and on the visible side of the hill
const frontY = () => Math.max(-270, castleWorldY() + 40);
function spawnEnemy(type, x, y) {
  const d = DEFS[type], lv = G.level;
  y = Math.max(y, frontY());
  const elite = type !== 'king' && lv >= 9 && Math.random() < Math.min(0.5, (lv - 8) * 0.06);
  const e = {
    type, d, x, y, kx: 0, ky: 0, r: d.r * (elite ? 1.12 : 1),
    hp: d.hp + (elite ? 1 : 0) + (type === 'king' ? lv : 0),
    spd: d.spd * (1 + Math.min(lv - 1, 20) * 0.045) * rand(0.9, 1.1),
    t: rand(0, 10), hitCd: 0, atkCd: 0.6, flash: 0, lunge: 0, stun: 0, age: 0, elite, flee: false, dead: false, phase: rand(0, TAU), fx: 1,
  };
  if (type === 'archer') { e.standY = rand(-140, 380); e.shootT = rand(0.8, 1.8); e.draw = 0; }
  if (type === 'king') e.summonT = 4;
  e.maxHp = e.hp;
  G.enemies.push(e);
  return e;
}
function spawnRandom() {
  const lv = G.level, pool = [];
  for (const k in SPAWN_WEIGHT) if (DEFS[k].unlock <= lv) pool.push([k, SPAWN_WEIGHT[k]]);
  let r = Math.random() * pool.reduce((s, a) => s + a[1], 0), type = 'bandit';
  for (const [k, w] of pool) { if ((r -= w) < 0) { type = k; break; } }
  const side = Math.random();
  let x, y;
  const fy = frontY();
  if (type === 'archer' || side < 0.64) { x = rand(30, W - 30); y = fy; }
  else if (side < 0.82) { x = -100; y = rand(Math.max(-150, fy), 600); }
  else { x = W + 100; y = rand(Math.max(-150, fy), 600); }
  // occasional pack of plain bandits
  if (lv >= 3 && type === 'bandit' && Math.random() < 0.25) {
    for (let i = 0; i < 2; i++) spawnEnemy('bandit', clamp(x + rand(-50, 50), 20, W - 20), y - rand(20, 60));
  }
  spawnEnemy(type, x, y);
}
function shootArrow(e) {
  const tr = G.traveler;
  const a = Math.atan2(tr.y - 10 - e.y, tr.x - e.x) + rand(-0.07, 0.07);
  const sp = 230 + Math.min(G.level, 20) * 8;
  G.arrows.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, a, life: 6 });
  e.draw = 0.25;
  sfx.shoot();
}

function updateEnemies(dt) {
  const tr = G.traveler;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.t += dt; e.hitCd -= dt; e.flash -= dt; e.atkCd -= dt; e.lunge -= dt; e.age += dt;
    e.x += e.kx * dt; e.y += e.ky * dt;
    const kd = Math.pow(0.015, dt); e.kx *= kd; e.ky *= kd;
    if (e.stun > 0 && !e.flee) { // staggered after a hit: no walking, no attacking
      e.stun -= dt; e.moving = false;
      e.x = clamp(e.x, -110, W + 110); e.y = Math.max(e.y, frontY() - 15);
      continue;
    }
    const dx = tr.x - e.x, dy = tr.y - e.y, dist = Math.hypot(dx, dy) || 1;
    let mvx = 0, mvy = 0;
    if (e.flee) {
      mvx = (e.x < W / 2 ? -1 : 1) * e.spd * 2.4; mvy = -e.spd * 0.6;
      if (e.x < -160 || e.x > W + 160 || e.y < -400) e.dead = true;
    } else if (e.type === 'archer') {
      if (e.y < Math.max(e.standY, castleWorldY() + 70)) mvy = e.spd;
      else {
        e.shootT -= dt; e.draw -= dt;
        if (e.shootT <= 0) { shootArrow(e); e.shootT = rand(2.0, 3.2) * Math.max(0.55, 1 - G.level * 0.025); }
      }
    } else {
      const nx = dx / dist, ny = dy / dist;
      if (e.type === 'runner') {
        const z = Math.sin(e.t * 6 + e.phase) * 0.9;
        mvx = (nx - ny * z) * e.spd; mvy = (ny + nx * z) * e.spd;
      } else { mvx = nx * e.spd; mvy = ny * e.spd; }
      if (dist < e.r + 18) {
        mvx = mvy = 0;
        if (e.type === 'bomber') { e.dead = true; explode(e.x, e.y, true); continue; }
        if (e.atkCd <= 0) { e.atkCd = e.type === 'king' ? 1.6 : 1.1; e.lunge = 0.18; hurtTraveler(e.d.dmg); }
      }
    }
    if (e.type === 'king' && !e.flee) {
      e.summonT -= dt;
      if (e.summonT <= 0) {
        e.summonT = Math.max(3.5, 6.5 - G.level * 0.1);
        for (let i = 0; i < 3; i++) spawnEnemy('bandit', e.x + rand(-60, 60), e.y + rand(-10, 40));
        const w = warp(e.x, e.y);
        addText('Get them, lads!', w.x, w.y - 60 * w.s, '#f5d0ff', 18, 1.2);
      }
    }
    if (Math.abs(mvx) > 1) e.fx = mvx > 0 ? 1 : -1;
    e.x += mvx * dt; e.y += mvy * dt;
    e.moving = Math.hypot(mvx, mvy) > 1;
    if (!e.flee) { e.x = clamp(e.x, -110, W + 110); e.y = Math.max(e.y, frontY() - 15); }
  }
  // separation
  const es = G.enemies;
  for (let i = 0; i < es.length; i++) {
    const a = es[i]; if (a.dead) continue;
    for (let j = i + 1; j < es.length; j++) {
      const b = es[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
      const d = Math.hypot(dx, dy) || 0.01;
      if (d < rr) {
        const push = (rr - d) / 2, nx = dx / d, ny = dy / d;
        const wa = b.r / rr, wb = a.r / rr; // bigger bodies get pushed less
        a.x -= nx * push * wa * 2; a.y -= ny * push * wa * 2;
        b.x += nx * push * wb * 2; b.y += ny * push * wb * 2;
      }
    }
  }
  G.enemies = es.filter(e => !e.dead);
}

function swordHits() {
  const p = K.p, h = p.rHand, t = p.tip;
  const hvx = h.x - h.px, hvy = h.y - h.py, tvx = t.x - t.px, tvy = t.y - t.py;
  for (const e of G.enemies) {
    if (e.dead || e.hitCd > 0) continue;
    const w = warp(e.x, e.y);
    if (hidden(w)) continue;
    const sd = segDist(w.x, w.y - 4 * w.s, h.x, h.y, t.x, t.y);
    if (sd.d > e.r * w.s + K.pad) continue;
    const vx = lerp(hvx, tvx, sd.t), vy = lerp(hvy, tvy, sd.t), sp = Math.hypot(vx, vy);
    if (sp < 3.5) continue;
    const nx = vx / sp, ny = vy / sp;
    e.hitCd = 0.2;
    const keen = G.upg.keen;
    if (sp < Math.max(3.5, e.d.min - keen * 1.5)) {
      const mass = e.r / 14;
      e.kx += nx * 90 / mass; e.ky += ny * 90 / mass;
      if (e.type === 'shield' || e.type === 'king') {
        sfx.clank(); sparks(sd.x, sd.y, 8);
        addText('TOO WEAK', w.x, w.y - (e.r + 16) * w.s, '#cfd8e3', 14, 0.6);
      }
      continue;
    }
    const dmg = sp >= 24 - keen * 3 ? 3 : sp >= 15 - keen * 2 ? 2 : 1;
    damageEnemy(e, dmg, nx, ny, sp, sd.x, sd.y);
  }
  // pickups: touch with any part of the knight
  for (const pk of G.pickups) {
    if (pk.taken) continue;
    const w = warp(pk.x, pk.y);
    for (const q of K.pts) {
      if (Math.hypot(q.x - w.x, q.y - (w.y - 10 * w.s)) < 24) { collectPickup(pk); break; }
    }
  }
}
function damageEnemy(e, dmg, nx, ny, sp, hx, hy) {
  const armor = e.d.armor;
  if (armor) dmg = 1; // plate armor: every hit counts as one, no matter how hard
  e.hp -= dmg; e.flash = 0.12;
  const mass = e.r / 14;
  const kb = (90 + sp * 14) / mass * (armor ? 1.9 : 1);
  e.kx += nx * kb; e.ky += ny * kb;
  burst(hx, hy, armor ? '#ffffff' : '#fff3c4', 6 + dmg * 3, 260, 3);
  G.shake = Math.max(G.shake, 2 + dmg * 2);
  if (dmg >= 3 && !armor) { const w = warp(e.x, e.y); addText('CRIT!', w.x, w.y - (e.r + 18) * w.s, '#ffcf3f', 18, 0.7); }
  if (e.hp <= 0) killEnemy(e, nx, ny, sp);
  else {
    e.stun = e.type === 'king' ? 0.08 : armor ? 0.5 : 0.25;
    if (armor) { sfx.clank(); sfx.hit(); } else sfx.hit();
  }
}
function killEnemy(e, nx, ny, sp) {
  e.dead = true;
  G.kills++; G.levelKills++;
  G.combo++; G.comboT = 2.2;
  const mult = 1 + Math.floor(G.combo / 5);
  const pts = e.d.score * (e.elite ? 2 : 1) * mult;
  G.score += pts;
  G.gold += Math.round(e.d.score * (e.elite ? 2 : 1) / 25);
  const w = warp(e.x, e.y);
  addText('+' + pts, w.x, w.y - 22 * w.s, '#ffe066', 16, 0.9);
  if (G.combo >= 5 && G.combo % 5 === 0) addText(G.combo + ' COMBO!  x' + mult, W / 2, 330, '#ff9f43', 30, 1.3);
  const fling = 220 + sp * 22;
  G.corpses.push({ e, x: e.x, y: e.y, vx: nx * fling, vy: ny * fling, rot: 0, vr: rand(-14, 14), life: 1.5 });
  burst(w.x, w.y, e.d.color, 14, 240, 4);
  sfx.kill();
  G.shake = Math.max(G.shake, 6);
  G.hitstop = 0.035;
  if (e.type === 'bomber') explode(e.x, e.y, false);
  if (e.type === 'king') {
    G.shake = 22; G.hitstop = 0.15;
    burst(w.x, w.y, '#d4af37', 40, 380, 6);
    sfx.boom();
    addText('BANDIT KING DEFEATED!', W / 2, 380, '#ffd84a', 30, 2.2);
    for (const o of G.enemies) if (!o.dead) o.flee = true; // the gang scatters
  }
  const chance = G.hp <= 2 ? 0.12 : 0.045;
  if (G.hp < G.maxHp && Math.random() < chance) G.pickups.push({ x: e.x, y: e.y, t: 0, life: 9, taken: false });
}
function explode(x, y, atTraveler) {
  sfx.boom();
  G.shake = Math.max(G.shake, 14);
  G.blasts.push({ x, y, t: 0 });
  const bw = warp(x, y);
  burst(bw.x, bw.y, '#ff9d2e', 26, 340, 6);
  burst(bw.x, bw.y, '#555', 14, 200, 7);
  if (atTraveler) hurtTraveler(2, true);
  else if (Math.hypot(G.traveler.x - x, G.traveler.y - y) < 75) hurtTraveler(1, true);
  for (const o of G.enemies) {
    if (o.dead) continue;
    const d = Math.hypot(o.x - x, o.y - y);
    if (d < 95) {
      const nx = (o.x - x) / (d || 1), ny = (o.y - y) / (d || 1);
      const ow = warp(o.x, o.y);
      damageEnemy(o, 3, nx, ny, 20, ow.x, ow.y);
    }
  }
}
function hurtTraveler(n, force) {
  if (G.state !== 'play' && G.state !== 'intro') return;
  const tr = G.traveler;
  if (tr.hurtT > 0 && !force) return;
  if (G.blocks > 0) {
    G.blocks--; tr.hurtT = 0.5; sfx.clank();
    const bw = warp(tr.x, tr.y);
    sparks(bw.x, bw.y - 20, 12);
    addText('BLOCKED!', bw.x, bw.y - 56 * bw.s, '#cfe8ff', 22, 1);
    return;
  }
  G.hp -= n; tr.hurtT = 0.8;
  G.shake = Math.max(G.shake, 10);
  G.combo = 0;
  sfx.hurt();
  const tw = warp(tr.x, tr.y);
  addText('-' + n + ' ♥', tw.x, tw.y - 56 * tw.s, '#ff4d4d', 24, 1);

}
function collectPickup(pk) {
  pk.taken = true;
  G.hp = Math.min(G.maxHp, G.hp + 1);
  sfx.pickup();
  const w = warp(pk.x, pk.y);
  addText('+1 ♥', w.x, w.y - 20, '#ff6b81', 20, 1);
  burst(w.x, w.y, '#ff6b81', 12, 160, 3);
}

// Particles & floating text

function burst(x, y, color, n, spd = 220, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, size: rand(size * 0.5, size * 1.3) });
  }
  if (G.parts.length > 500) G.parts.splice(0, G.parts.length - 500);
}
function sparks(x, y, n) { burst(x, y, '#fff', n, 300, 2.5); }
function addText(s, x, y, color, size = 18, life = 1) { G.texts.push({ s, x, y, color, size, life, max: life }); }

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt) {
  stepKnight();
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  G.stateT += dt;
  const tr = G.traveler;
  tr.hurtT -= dt;

  if (G.state === 'arrive' || G.state === 'complete') G.walk = Math.max(0, G.walk - WALK * dt * 0.9);
  else if (G.state === 'gameover') G.walk = Math.max(0, G.walk - WALK * dt * 2);
  else G.walk = Math.min(WALK, G.walk + WALK * dt);
  G.scroll += G.walk * dt;
  if (G.walk > 1 && G.state !== 'gameover') tr.anim += dt * 7 * (G.walk / WALK);

  let target = 0;
  if (G.state === 'play') target = Math.min(G.levelTime / G.levelDur, G.boss && !G.boss.dead ? 0.96 : 1);
  else if (G.state === 'arrive' || G.state === 'complete') target = 1;
  G.prog += (target - G.prog) * Math.min(1, dt * 2);

  if (G.state === 'intro' && G.stateT > 2.8) { G.state = 'play'; G.stateT = 0; }

  if (G.state === 'play') {
    G.levelTime += dt;
    G.spawnT -= dt;
    const cap = Math.min(10 + G.level * 2, 40);
    const spawnWindow = !G.isBoss || !G.boss || G.boss.dead;
    if (G.spawnT <= 0 && G.levelTime < G.levelDur - 2) {
      if (G.enemies.length < cap && spawnWindow) spawnRandom();
      G.spawnT = Math.max(0.33, 1.7 * Math.pow(0.9, G.level - 1)) * rand(0.6, 1.3);
    }
    if (G.isBoss && !G.bossSpawned && G.levelTime > G.levelDur * 0.45) {
      G.bossSpawned = true;
      G.boss = spawnEnemy('king', W / 2, frontY());
      addText('THE BANDIT KING!', W / 2, 360, '#e7b6ff', 34, 2);
      sfx.boss();
      G.shake = 12;
    }
    if (G.levelTime >= G.levelDur && !(G.boss && !G.boss.dead)) beginArrive();
  }

  if (G.state === 'arrive' && G.walk <= 0) {
    const gateY = castleWorldY();
    if (tr.y > gateY + 8) { tr.y -= 130 * dt; tr.anim += dt * 8; }
    if (tr.y < gateY + 50) tr.alpha = Math.max(0, tr.alpha - dt * 2.2);
    if (tr.alpha <= 0) completeLevel();
  }

  if (G.state === 'play' || G.state === 'intro' || G.state === 'arrive' || G.state === 'gameover') {
    updateEnemies(dt);
  }
  if (G.state === 'play' || G.state === 'intro' || G.state === 'arrive') swordHits();

  // hired archers escorting the traveler
  if (G.upg.archers && (G.state === 'play' || G.state === 'intro')) {
    for (let i = 0; i < G.upg.archers; i++) {
      G.allyCd[i] -= dt;
      if (G.allyCd[i] > 0) continue;
      const ax = tr.x + ALLY_OFF[i][0], ay = tr.y + ALLY_OFF[i][1] - 14;
      let best = null, bd = 560;
      for (const e of G.enemies) {
        if (e.dead || e.flee || e.age < 0.4) continue;
        const d = Math.hypot(e.x - ax, e.y - ay);
        if (d < bd && warp(e.x, e.y).y > 110) { bd = d; best = e; }
      }
      if (!best) { G.allyCd[i] = 0.2; continue; }
      const ang = Math.atan2(best.y - ay, best.x - ax);
      G.allyArrows.push({ x: ax, y: ay, vx: Math.cos(ang) * 520, vy: Math.sin(ang) * 520, life: 1.6 });
      G.allyCd[i] = rand(1.3, 1.7);
      tone(1100, 0.06, 'triangle', 0.05, 0.6);
    }
  }
  for (const a of G.allyArrows) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt;
    for (const e of G.enemies) {
      if (e.dead || Math.hypot(e.x - a.x, e.y - a.y) > e.r + 5) continue;
      const sp = Math.hypot(a.vx, a.vy), w = warp(e.x, e.y);
      damageEnemy(e, 1, a.vx / sp, a.vy / sp, 8, w.x, w.y);
      a.life = 0; break;
    }
  }
  G.allyArrows = G.allyArrows.filter(a => a.life > 0);

  // arrows
  const p = K.p;
  for (const a of G.arrows) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt;
    const aw = warp(a.x, a.y);
    const sd = segDist(aw.x, aw.y, p.rHand.x, p.rHand.y, p.tip.x, p.tip.y);
    let blocked = sd.d < 8 + K.pad;
    if (!blocked) for (const q of K.pts) if (Math.hypot(q.x - aw.x, q.y - aw.y) < 12) { blocked = true; break; }
    if (blocked) {
      a.life = 0; sparks(aw.x, aw.y, 10); sfx.clank();
      G.score += 25; addText('+25', aw.x, aw.y - 12, '#cfe8ff', 13, 0.6);
      continue;
    }
    if (Math.hypot(a.x - tr.x, a.y - (tr.y - 12)) < 18 && G.state === 'play') { a.life = 0; hurtTraveler(1); }
    if (a.x < -160 || a.x > W + 160 || a.y > H + 40 || a.y < -400) a.life = 0;
  }
  G.arrows = G.arrows.filter(a => a.life > 0);

  // pickups drift with the ground
  for (const pk of G.pickups) {
    pk.t += dt; pk.life -= dt; pk.y += G.walk * dt;
    if (!pk.taken && Math.hypot(pk.x - tr.x, pk.y - tr.y) < 28) collectPickup(pk);
  }
  G.pickups = G.pickups.filter(pk => !pk.taken && pk.life > 0 && pk.y < H + 30);

  for (const c of G.corpses) {
    c.x += c.vx * dt; c.y += c.vy * dt + G.walk * dt;
    const f = Math.pow(0.08, dt); c.vx *= f; c.vy *= f; c.vr *= f;
    c.rot += c.vr * dt; c.life -= dt;
  }
  G.corpses = G.corpses.filter(c => c.life > 0);
  for (const q of G.parts) {
    q.x += q.vx * dt; q.y += q.vy * dt;
    const f = Math.pow(0.05, dt); q.vx *= f; q.vy *= f; q.life -= dt;
  }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const t of G.texts) { t.y -= 34 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const b of G.blasts) b.t += dt;
  G.blasts = G.blasts.filter(b => b.t < 0.45);

  if (G.shopMsg) { G.shopMsg.t -= dt; if (G.shopMsg.t <= 0) G.shopMsg = null; }
  G.comboT -= dt;
  if (G.comboT <= 0) G.combo = 0;
  G.shake *= Math.pow(0.0015, dt);
}

}

const CH = 240;
const chunkRange = () => [Math.floor((G.scroll - 80) / CH), Math.floor((G.scroll + H + 460) / CH)];
const chunkY = wy => G.scroll - wy + H; // world distance -> world y

function drawSky() {
  const b = G.biome, hy = horizonY(0);

    const cy = 40 + hash(i * 7 + 2) * 90, k = 0.7 + hash(i * 3 + 5) * 0.6;
    ellipse(cx, cy, 42 * k, 12 * k, '#fff'); ellipse(cx + 18 * k, cy - 7 * k, 24 * k, 12 * k, '#fff'); ellipse(cx - 16 * k, cy - 5 * k, 20 * k, 10 * k, '#fff');

// Flat ground: hill body, patches, tufts, road. Upright decor is returned for y-sorting with actors.
function drawGround() {
  const b = G.biome;
  ctx.fillStyle = b.g1;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let X = 0; X <= W; X += 18) ctx.lineTo(X, horizonY(X));
  ctx.lineTo(W, horizonY(W)); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  const [c0, c1] = chunkRange();
  for (let c = c0; c <= c1; c++) {
    for (let i = 0; i < 7; i++) { // patches
      const s = c * 131 + i * 17;
      const w = warp(-240 + hash(s) * (W + 480), chunkY(c * CH + hash(s + 1) * CH));
      if (hidden(w) || w.y > H + 60) continue;
      ctx.fillStyle = hash(s + 4) < 0.5 ? b.g2 : b.g3;
      ctx.beginPath(); ctx.ellipse(w.x, w.y, (30 + hash(s + 2) * 50) * w.s, (14 + hash(s + 3) * 20) * w.s * Math.max(0.2, w.c), 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = b.g2;
    for (let i = 0; i < 20; i++) { // tufts
      const s = c * 977 + i * 31;
      const w = warp(-240 + hash(s) * (W + 480), chunkY(c * CH + hash(s + 1) * CH));
      if (hidden(w) || w.y > H + 10) continue;
      const k = w.s;
      ctx.fillRect(w.x, w.y, 2 * k, 5 * k); ctx.fillRect(w.x + 3 * k, w.y - k, 2 * k, 6 * k); ctx.fillRect(w.x + 6 * k, w.y + k, 2 * k, 4 * k);
    }
  }
  // road over the hill to the castle gate
  const topY = Math.max(castleWorldY(), HORIZON_WY);
  const ys = [];
  for (let y = H + 60; y > topY; y -= 24) ys.push(y);
  ys.push(topY);
  const strip = (half, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    ys.forEach((y, i) => { const w = warp(W / 2 - half, y); i ? ctx.lineTo(w.x, w.y) : ctx.moveTo(w.x, w.y); });
    for (let i = ys.length - 1; i >= 0; i--) { const w = warp(W / 2 + half, ys[i]); ctx.lineTo(w.x, w.y); }
    ctx.closePath(); ctx.fill();
  };

    for (let i = 0; i < 7; i++) {
      const s = c * 613 + i * 7;
      const y = chunkY(c * CH + hash(s) * CH);

      if (w.y > H + 10) continue;
      ctx.fillStyle = b.edge;
      ctx.beginPath(); ctx.ellipse(w.x, w.y, (2 + hash(s + 2) * 3) * w.s, (1.5 + hash(s + 3) * 2) * w.s * Math.max(0.3, w.c), 0, 0, TAU); ctx.fill();

}
function collectDecor(out) {

function drawHaze() {

function drawDecor(kind, x, y, s, seed) {

function drawCastle() {
  const cw = warp(W / 2, castleWorldY()), b = G.biome, t = performance.now() / 1000;

    ctx.fillStyle = b.roof; ctx.beginPath(); ctx.moveTo(x - 42, -198); ctx.lineTo(x, -275); ctx.lineTo(x + 42, -198); ctx.fill();
    ctx.fillStyle = shade(b.roof, -25); ctx.beginPath(); ctx.moveTo(x, -275); ctx.lineTo(x + 42, -198); ctx.lineTo(x, -198); ctx.fill();

  }

  for (let row = 0; row < 6; row++) {
    const y = -112 + row * 20;
    ctx.beginPath(); ctx.moveTo(-118, y); ctx.lineTo(118, y); ctx.stroke();
    for (let x = -118 + (row % 2) * 18; x < 118; x += 36) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 20); ctx.stroke(); }
  }

  ctx.fillStyle = shade(stone, -30);

  ctx.fillStyle = '#1e140d';
  ctx.beginPath(); ctx.moveTo(-32, 0); ctx.lineTo(-32, -62); ctx.arc(0, -62, 32, Math.PI, 0); ctx.lineTo(32, 0); ctx.fill();

  ctx.beginPath(); ctx.moveTo(-32, 0); ctx.lineTo(-32, -62); ctx.arc(0, -62, 32, Math.PI, 0); ctx.lineTo(32, 0); ctx.clip();

function shade(hex, amt) {

function drawFigure(e, x, y, rot, alpha, dead, sc = 1) {

function drawKnight() {

      text('HAS FALLEN', W / 2, 424, 38, '#ff6b6b');
      text(`Score: ${G.score.toLocaleString()}`, W / 2, 484, 26, '#ffe27a');
      text(`Reached level ${G.level}  ·  ${G.kills} bandits slain`, W / 2, 520, 17, '#f4ece0', 'center', 700);
      text(G.newHigh ? 'NEW BEST!' : `Best: ${G.best.toLocaleString()}`, W / 2, 556, 18, G.newHigh ? '#7dff9a' : '#d8cfc0');
      if (G.stateT > 1 && blink) text('CLICK TO TRY AGAIN', W / 2, 604, 22, '#fff');
    }
  }
  if (paused) {
    ctx.fillStyle = 'rgba(10,8,6,0.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, H / 2 - 20, 50, '#ffe27a');
    text('Click to resume', W / 2, H / 2 + 30, 20, '#fff', 'center', 700);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#14110f'; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = scale * dpr;
  const shx = G.shake > 0.3 ? rand(-G.shake, G.shake) : 0, shy = G.shake > 0.3 ? rand(-G.shake, G.shake) : 0;
  ctx.setTransform(s, 0, 0, s, offX * dpr, offY * dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.translate(shx, shy);
  drawSky();
  const castleFar = hidden(warp(W / 2, castleWorldY()));
  if (castleFar) drawCastle(); // peeking over the hill, the ground covers its base
  drawGround();
  drawHaze();
  for (const bl of G.blasts) {
    const k = bl.t / 0.45, w = warp(bl.x, bl.y);
    ctx.globalAlpha = 1 - k;
    circle(w.x, w.y, (20 + k * 80) * w.s, '#ffb347'); circle(w.x, w.y, (10 + k * 50) * w.s, '#fff3c4');
    ctx.globalAlpha = 1;
  }
  for (const pk of G.pickups) {
    if (pk.life < 2 && Math.floor(pk.t * 10) % 2) continue;
    const w = warp(pk.x, pk.y), by = Math.sin(pk.t * 4) * 3;
    ellipse(w.x, w.y + 10 * w.s, 9 * w.s, 3 * w.s, 'rgba(0,0,0,0.25)');
    heartPath(w.x, w.y + (by - 10) * w.s, 22 * w.s); ctx.fillStyle = '#ff4d5e'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const c of G.corpses) { const w = warp(c.x, c.y); if (!hidden(w)) drawFigure(c.e, w.x, w.y, c.rot, clamp(c.life / 0.6, 0, 1), true, w.s); }
  // y-sorted actors, trees and castle (painter's order over the hill)
  const actors = [];
  for (const e of G.enemies) { const w = warp(e.x, e.y); if (!hidden(w)) actors.push({ y: e.y, k: 0, e, w }); }
  actors.push({ y: G.traveler.y, k: 1 });
  for (let i = 0; i < G.upg.archers; i++) actors.push({ y: G.traveler.y + ALLY_OFF[i][1], k: 4, i });
  collectDecor(actors);
  if (!castleFar) actors.push({ y: castleWorldY(), k: 3 });
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a.k === 0) drawFigure(a.e, a.w.x, a.w.y, 0, Math.min(1, a.e.age / 0.5), false, a.w.s);
    else if (a.k === 4) drawAlly(a.i);
    else if (a.k === 1) drawTraveler();
    else if (a.k === 2) drawDecor(a.kind, a.w.x, a.w.y, a.sc * a.w.s, a.seed);
    else drawCastle();
  }
  for (const a of G.arrows) {
    const w = warp(a.x, a.y), w2 = warp(a.x + a.vx * 0.02, a.y + a.vy * 0.02);
    if (hidden(w)) continue;
    ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(Math.atan2(w2.y - w.y, w2.x - w.x)); ctx.scale(w.s, w.s);
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(6, 0); ctx.stroke();
    ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.fill();
    ctx.fillStyle = '#eee'; ctx.fillRect(-15, -3, 5, 2); ctx.fillRect(-15, 1, 5, 2);
    ctx.restore();
  }
  for (const a of G.allyArrows) {
    const w = warp(a.x, a.y), w2 = warp(a.x + a.vx * 0.02, a.y + a.vy * 0.02);
    ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(Math.atan2(w2.y - w.y, w2.x - w.x)); ctx.scale(w.s, w.s);
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(6, 0); ctx.stroke();
    ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.fill();
    ctx.fillStyle = '#5fb0ff'; ctx.fillRect(-15, -3, 5, 2); ctx.fillRect(-15, 1, 5, 2);
    ctx.restore();
  }
  for (const q of G.parts) {
    ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  const knightOnTop = G.state === 'complete' || G.state === 'title' || G.state === 'gameover';
  if (!knightOnTop) drawKnight();
  for (const t of G.texts) { ctx.globalAlpha = clamp(t.life / t.max * 2, 0, 1); text(t.s, t.x, t.y, t.size, t.color); }
  ctx.globalAlpha = 1;
  ctx.translate(-shx, -shy);
  drawHUD();
  drawOverlay();
  if (knightOnTop) drawKnight(); // the knight is your cursor on menus
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Main loop (fixed 60Hz simulation)
// ---------------------------------------------------------------------------
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Small debug/QA hook (harmless in production)
window.__floppyKnight = { G, K, pointer, step: n => { for (let i = 0; i < n; i++) update(STEP); render(); } };
})();
</script>
</body>
</html>
